<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  body{margin:0}
  .card{width:1200px;height:630px;background:#0A1410;position:relative;overflow:hidden;font-family:'Fraunces',Georgia,serif}
  .card::before{content:"";position:absolute;inset:-20%;background:
    radial-gradient(40% 34% at 80% 10%, rgba(201,169,97,.14), transparent 60%),
    radial-gradient(44% 38% at 10% 90%, rgba(38,84,62,.4), transparent 60%);filter:blur(30px)}
  .card::after{content:"";position:absolute;inset:0;opacity:.5;background-image:
    linear-gradient(rgba(237,232,218,.09) 1px,transparent 1px),
    linear-gradient(90deg,rgba(237,232,218,.09) 1px,transparent 1px);background-size:72px 72px;
    -webkit-mask-image:radial-gradient(120% 100% at 50% 0%, #000 30%, transparent 90%)}
  .in{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;padding:0 90px}
  .kick{font-family:'IBM Plex Mono',monospace;font-size:20px;letter-spacing:.24em;text-transform:uppercase;color:#C9A961;margin-bottom:28px}
  h1{margin:0;font-weight:300;font-size:78px;line-height:1.08;letter-spacing:-.015em;color:#EDE8DA;max-width:19ch}
  h1 em{font-style:italic;font-weight:600;color:#C9A961}
  .foot{position:absolute;left:90px;bottom:56px;font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:.06em;color:#8FA294}
  .foot b{color:#EDE8DA;font-weight:500}
</style></head>
<body>
  <div class="card">
    <div class="in">
      <p class="kick">◆ Intent-Driven Development</p>
      <h1>The quality of AI output is determined by the quality of the <em>intent</em> you express.</h1>
    </div>
    <p class="foot"><b>Scott Feltham</b> — creator of FORGE · scottfeltham.com</p>
  </div>
</body></html>
