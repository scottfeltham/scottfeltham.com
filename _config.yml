# scottfeltham.com — minimal Jekyll config.
# The root pages are hand-authored static HTML and pass through untouched.
# Jekyll exists here only to render the /forge/ documentation from markdown
# through our own layout (no external theme).

title: Scott Feltham
description: >-
  Engineering leader, creator of the FORGE Framework and Intent-Driven
  Development.
url: "https://scottfeltham.com"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: false

# No plugins: keeps the GitHub Pages build in the safest possible configuration.
plugins: []

exclude:
  - labs/
  - README.md
  - CLAUDE.md
  - forge.yaml
  - Gemfile
  - Gemfile.lock
  - vendor/

defaults:
  - scope:
      path: "forge"
    values:
      layout: forge
